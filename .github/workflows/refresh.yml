name: refresh

on:
  schedule:
    # Every 15 minutes (GitHub cron granularity is ~5 min and may be delayed
    # under load — that's fine for football data).
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build JSON
        working-directory: scripts
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          # Pages serves /docs, so publish under docs/api/v2 -> live at
          # https://notebook2cash-jpg.github.io/sianstep-football-api/api/v2/
          OUT_DIR: ${{ github.workspace }}/docs/api/v2
        run: python build_all.py

      - name: Commit if changed
        run: |
          git config user.name  "football-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/api/v2
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "refresh football data $(date -u +%FT%TZ)"
            git push
          fi
